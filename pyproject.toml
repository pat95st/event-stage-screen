[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stagescreen"
dynamic = ["version"]
description = "Dual-output stage display for eventrentmanager on a Raspberry Pi"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.37",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "itsdangerous>=2.1",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
stagescreen = "stagescreen.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "stagescreen.__version__" }

[tool.setuptools.packages.find]
include = ["stagescreen*"]

[tool.setuptools.package-data]
stagescreen = ["web/templates/*.html", "web/static/css/*", "web/static/js/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["prototype"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP031", "UP042"]
